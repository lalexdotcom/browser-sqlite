name: pages

# THE SITE IS A PURE FUNCTION OF TWO TAGS.
#
#   /          <- the latest release tag
#   /preview/  <- the `preview` tag, when one exists
#
# Nothing else decides what is published. The ref that TRIGGERED a run is never
# built and never consulted, so every trigger below produces the same, correct
# site and re-running anything is idempotent. That is the whole design: `/`
# cannot drift to unreleased code, and a preview cannot survive as a mystery —
# it is whatever `preview` points at, or it is absent.
#
# Want a preview? Move the tag:
#
#   git tag -f preview && git push -f origin preview
#
# Want it gone? Delete the tag. Both republish the site, and there is no manual
# trigger: re-pushing the tag unchanged is the republish.
#
# `deploy-pages` publishes an artifact that REPLACES the whole site, which is
# why both halves are rebuilt on every run rather than one being patched in.
# It is also why there is exactly one preview slot: keeping a history per
# commit would mean serving Pages from a branch — a different mechanism, a
# write permission this workflow does not have, and a retention policy nobody
# wants to own.
#
# Local testing needs none of this: `pnpm bench:build && pnpm bench:serve` on
# http://localhost, already a secure context, so OPFS works with no
# certificate. The preview exists for devices that cannot reach localhost — an
# iPad against the machine that built it.
on:
  # From release-and-publish.yaml, after it has published. It arrives at the
  # new tag, but that is not what makes the root correct: `gh release view`
  # already returns the release this run just created.
  workflow_call:
  # Moving the tag is the whole gesture, and re-pushing it unchanged is also
  # how you republish — there is no manual dispatch. WHICH WORKFLOW FILE RUNS
  # DIFFERS BY TRIGGER, and it bites once: a `push` runs the file as it exists
  # AT THE PUSHED COMMIT, so tagging a commit that predates this file fires
  # nothing at all. `delete` and `workflow_call` read the default branch and
  # the caller's ref respectively.
  push:
    tags:
      - preview
  # Deleting `preview` must take the preview down, and GitHub does NOT fire
  # `push` for a deleted ref — `delete` is the event for that. It carries no
  # ref filter, hence the job-level guard.
  #
  # NOTE, and it constrains the environment settings: a `delete` run executes
  # from the DEFAULT BRANCH, so its deployment presents `refs/heads/main`. If
  # the github-pages environment is restricted to tags only, this one trigger
  # is refused and a deleted tag leaves its preview on the site until the next
  # release. Keep `main` allowed if you want deletion to work.
  delete:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; a superseded run is cancelled rather than raced.
# Safe by construction here: every run rebuilds the same two tags, so whichever
# run wins publishes the same site the cancelled one would have.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # `delete` fires for every branch and tag in the repository.
    if: >-
      github.event_name != 'delete' ||
      (github.event.ref_type == 'tag' && github.event.ref == 'preview')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checked out for the tooling only — `pnpm/action-setup` reads
      # `packageManager` from a package.json at the workspace root. NOTHING is
      # built from this checkout; both halves build from their own tag below.
      - uses: actions/checkout@v6

      - name: Resolve the two tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `/releases/latest` FIRST, and the list only as a fallback — the two
          # answer different questions and the order matters later.
          #
          # `latest` is the release GitHub designates, and it is what npm's
          # `latest` dist-tag will follow. The page's badge claims the root IS
          # "the published package", so that is the one to honour: once a stable
          # 1.0.0 ships and an rc.6 follows it, the LIST would put the root on
          # the rc while `npm i browser-sqlite` still gives the stable, and the
          # badge would be a lie.
          #
          # But `latest` EXCLUDES prereleases, and every release this project
          # has cut so far is one — rc.3, rc.4. It answers 404 today, which is
          # how the first preview run failed with "release not found". So the
          # fallback takes the newest published release whatever its kind,
          # drafts filtered out because the workflow token can see them. The
          # fallback stops being the live path the day a stable version ships.
          # THE EXIT STATUS MUST GATE THE ASSIGNMENT. `gh api` on a 404 writes
          # the response BODY to stdout as well as failing, and `--jq` does not
          # filter it — so `$(… || true)` captures `{"message":"Not Found",…}`
          # as if it were data. That is not hypothetical: it reached
          # actions/checkout as a ref and died on
          # `fatal: invalid refspec '+refs/heads/{"message":"Not Found"…'`.
          RELEASE=""
          if LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null); then
            RELEASE="$LATEST"
          fi

          if [ -z "$RELEASE" ] || [ "$RELEASE" = "null" ]; then
            RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
              --jq '[.[] | select(.draft == false)][0].tag_name')
            echo "No designated latest release — falling back to the newest published"
          fi

          # A shape check, because the failure above was SILENT: garbage passed
          # every emptiness test and only died three steps later, in a message
          # about refspecs. Whatever goes to a checkout is named here or the
          # run stops here.
          case "$RELEASE" in
            v[0-9]*) ;;
            *)
              echo "::error::resolved release tag is not a version tag: '$RELEASE'"
              exit 1
              ;;
          esac
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Root: $RELEASE"

          # `commits/preview` resolves through an annotated tag to the commit,
          # which `git/ref/tags/preview` would not: there `.object.sha` is the
          # tag object. The page prints this, so a wrong one is a wrong claim
          # about which code was measured.
          if SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/preview" --jq .sha 2>/dev/null); then
            echo "preview=true" >> "$GITHUB_OUTPUT"
            echo "preview_sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Preview: $SHA"
          else
            echo "preview=false" >> "$GITHUB_OUTPUT"
            echo "Preview: no preview tag — the site will carry none"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tags.outputs.release }}
          path: release

      - uses: actions/checkout@v6
        if: steps.tags.outputs.preview == 'true'
        with:
          ref: preview
          path: preview

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # THE ROOT, and it must come FIRST. `assemble.mjs` opens with
      # `rmSync(target, { recursive: true, force: true })`, so assembling the
      # root after the preview would delete the preview that sits inside it.
      #
      # GITHUB_REF_NAME and GITHUB_REF_TYPE are overridden deliberately.
      # `assemble.mjs` reads them to decide whether the page may call itself a
      # release build, and the runner's values describe the ref that TRIGGERED
      # the run — which here is never the ref being built. Left alone, the root
      # of the public site would label a genuine release "development build",
      # in the one place the script's own comment says a stranger cannot check.
      - name: Build the root, from the release tag
        working-directory: release
        env:
          GITHUB_REF_NAME: ${{ steps.tags.outputs.release }}
          GITHUB_REF_TYPE: tag
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/bench/assemble.mjs "$GITHUB_WORKSPACE/_site"

      # THE PREVIEW, second, inside the root.
      #
      # All three GITHUB_* are set, and each for its own reason.
      # REF_TYPE is forced to `branch` so the page cannot claim to be a
      # release: `preview` IS a tag, and assemble.mjs takes any tag for a
      # release tag. REF_NAME names the slot. And SHA must be the tag's commit
      # — the runner's value is the ref that triggered the run, so left alone
      # the page would print `preview @ <some other commit>` and name code it
      # did not measure.
      - name: Build the preview, from the preview tag
        if: steps.tags.outputs.preview == 'true'
        working-directory: preview
        env:
          GITHUB_REF_NAME: preview
          GITHUB_REF_TYPE: branch
          GITHUB_SHA: ${{ steps.tags.outputs.preview_sha }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/bench/assemble.mjs "$GITHUB_WORKSPACE/_site/preview"
          echo "Preview served at <page-url>/preview/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
