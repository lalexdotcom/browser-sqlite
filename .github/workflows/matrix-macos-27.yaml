name: Matrix (macOS 27)

# Every pair through Chrome's, Firefox's and Safari's columns on macOS 27, by
# hand. Each run goes to the end and shows every pair: a macOS runner loses
# Safari sessions, and one such pair would otherwise cancel the others.
on:
  workflow_dispatch:

concurrency:
  group: matrix-macos-27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-27:
    # checks: write for the live progress check runs (scripts/ci-progress.ts):
    # a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/matrix.yaml
    with:
      # GitHub has no macos-27 label yet: macOS 27 comes only with the Xcode 27
      # image, in public preview. Move to macos-27 once it exists.
      runs-on: xcode-27
      browsers: chrome,firefox,safari
      # On GitHub's macOS runners a setTimeout(0) takes 16-25 ms in Chrome and
      # Firefox started by their WebDriver, against 4.5-6 ms on Linux and on a
      # Mac's foreground tab: a test built on timers runs ~4 times slower here.
      time-scale: '2'
      # The planner bounds each cell at 900 s × 2 = 30 min and runs as many
      # cells at once as the runner has cores less one (2 of 3 here), Safari.s
      # one at a time: a pair of 6 cells takes at most three rounds, 90 min,
      # plus the probes. Above that, a hang ends in the planner as a failure
      # that uploads its report.
      timeout-minutes: 120
      # Probing three browsers in both modes, Safari's one at a time.
      plan-timeout-minutes: 30
