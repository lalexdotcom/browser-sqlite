name: pages

# The published site tracks the released package and nothing else: a visitor
# who lands here must be benchmarking code they can actually install. So the
# only automatic caller is the release workflow, after it has published — see
# release-and-publish.yaml, which calls this one with `needs: release`.
#
# workflow_dispatch stays as the escape hatch: republishing after a failed
# deploy, without cutting a release to do it. Dev testing runs locally instead
# (`pnpm bench:build && pnpm bench:serve` — http://localhost is already a
# secure context, so OPFS works with no certificate).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; a superseded run is cancelled rather than raced.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm build

      - name: Assemble the page
        run: node scripts/bench/assemble.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
