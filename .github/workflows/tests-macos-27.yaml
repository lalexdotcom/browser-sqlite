name: Tests (macOS 27)

on:
  workflow_dispatch:

concurrency:
  group: tests-macos-27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-27:
    uses: ./.github/workflows/tests.yaml
    with:
      # GitHub has no macos-27 label yet: macOS 27 comes only with the Xcode 27
      # image, in public preview. Move to macos-27 once it exists.
      runs-on: xcode-27
      browsers: chrome,firefox
