name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Browser tests run against Chromium only (see rstest.config.ts).
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint and format check
        run: pnpm exec biome ci .

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      # Unit (Node) + browser (Chromium) projects.
      - name: Test
        run: pnpm test

  # Exercises the packed tarball in a real Vite app, which `verify` never does —
  # it bundles src/ and so never touches dist/, the exports map, or third-party
  # worker resolution.
  #
  # KNOWN FAILING until the wave 4 packaging work: dist/ ships
  # `new Worker(new URL('./worker.ts', …))` with no worker artifact beside it.
  # Non-blocking on purpose; flip `continue-on-error` off once wave 4 lands.
  consumer-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Consumer smoke test
        run: pnpm test:consumer
