name: Tests (Windows)

on:
  workflow_dispatch:
  # TEMPORARY: runs the workflow from its branch before it exists on main.
  # Removed before the merge.
  push:
    branches:
      - ci/windows-macos

concurrency:
  group: tests-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/tests.yaml
    with:
      runs-on: windows-latest
      # Firefox pays 50-220 ms of fsyncs for every OPFS file open, close or
      # delete on Windows (Mozilla bug 2072928): its OPFS tests run 7-16 times
      # slower than Chrome's there.
      time-scale: '4'
      timeout-minutes: 240
