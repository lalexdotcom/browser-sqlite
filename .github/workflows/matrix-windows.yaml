name: Matrix (Windows)

# Every pair through Chrome's and Firefox's columns on Windows, by hand. Each
# run goes to the end and shows every pair.
on:
  workflow_dispatch:

concurrency:
  group: matrix-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # checks: write for the live progress check runs (scripts/ci-progress.ts):
    # a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/matrix.yaml
    with:
      runs-on: windows-latest
      # Firefox pays 50-220 ms of fsyncs for every OPFS file open, close or
      # delete on Windows (Mozilla bug 2072928): its OPFS tests run 7-16 times
      # slower than Chrome's there.
      time-scale: '4'
      # The planner bounds each cell at 900 s × 4 = 60 min and runs a pair's
      # cells in parallel: a hang ends there as a failure that uploads its
      # report, inside the job's bound.
      timeout-minutes: 100
      # Probing both browsers in both modes, at Windows' pace.
      plan-timeout-minutes: 60
