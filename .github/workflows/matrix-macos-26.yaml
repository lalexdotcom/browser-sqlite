name: Matrix (macOS 26)

# Every pair through Chrome's, Firefox's and Safari's columns on macOS 26, by
# hand. Each run goes to the end and shows every pair: a macOS runner loses
# Safari sessions, and one such pair would otherwise cancel the others.
on:
  workflow_dispatch:

concurrency:
  group: matrix-macos-26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-26:
    # checks: write for the live progress check runs (scripts/ci-progress.ts):
    # a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/matrix.yaml
    with:
      runs-on: macos-26
      browsers: chrome,firefox,safari
      # On GitHub's macOS runners a setTimeout(0) takes 16-25 ms in Chrome and
      # Firefox started by their WebDriver, against 4.5-6 ms on Linux and on a
      # Mac's foreground tab: a test built on timers runs ~4 times slower here.
      # 2 is enough with one cell at a time (below): the longest cell took
      # 619 s, a third of its bound (2026-11-15). 3 was tried, and pushed
      # open-retry's own fallback past the library's unscaled retry budget.
      time-scale: '2'
      # One cell at a time: on these 3 cores the pair's browsers slowed each
      # other down to 130 times a local run while they overlapped, and to 5-15
      # times once alone (Chrome, 2026-11-15, the slowdown ending with the
      # pair's Firefox cell).
      jobs: '1'
      # The planner bounds each cell at 900 s × 2 = 30 min and, one at a time,
      # a pair of 6 cells takes at most 180 min, 210 with a cell run again
      # after its browser failed (a second bound, scripts/test-plan.ts); in
      # practice 3-10 min a cell. The limit is GitHub's maximum, so a hang
      # ends in the planner as a failure that uploads its report.
      timeout-minutes: 360
      # Probing three browsers in both modes, Safari's one at a time.
      plan-timeout-minutes: 30
