name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One browser list for the whole workflow, named in the cache key and
      # installed identically by both jobs. The key names the browsers because
      # actions/cache only *saves* on a miss: a key that did not would stay
      # identical when the list grows, hit on the older and smaller cache, and
      # re-download the missing engines on every run, silently, until the
      # lockfile happened to change. Keeping one list rather than one per job
      # is deliberate — two lists that must agree is a drift waiting to happen,
      # and consumer-smoke installing an engine it does not drive costs only
      # apt time on a cache hit.
      #
      # Both engines are driven: Chromium by `pnpm test`, Firefox by the step
      # after it. Firefox is the engine that answers RWU-1 — it ignores the
      # readwrite-unsafe access-handle mode, so it is the only one here that
      # exercises OPFSAdaptiveVFS's degraded path, which is where the pool's
      # readiness gate and the commit barrier are actually load-bearing.
      #
      # WebKit is deliberately absent. It was added and removed on 2026-08-24:
      # Playwright's Linux WebKit exposes no `navigator.storage` at all, so it
      # cannot exercise any VFS this library ships and reported 9/104 for that
      # single reason. A real WebKit signal needs Playwright on macOS. Adding
      # it back means changing this comment, the list below, and the key above,
      # together.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Lint and format check
        run: pnpm exec biome ci .

      # The README's VFS table is generated from VFS_CAPABILITIES. Regenerate
      # and fail on any diff: the table cannot drift from the declarations,
      # while the conformance job proves the declarations are true.
      - name: VFS table is current
        run: |
          pnpm docs:vfs
          git diff --exit-code README.md

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      # Unit (Node) + browser (Chromium) projects.
      - name: Test
        run: pnpm test

      # The browser project again, on Firefox. A gate since 2026-08-28, on the
      # strength of 13 consecutive green runs after `long-query` was diagnosed
      # (it timed the FILE, not the pool) and `barrier` stopped reproducing.
      # Expect this to be the step that catches a reduced-mode regression: it
      # is the only one that runs the pool against a rotating exclusive OPFS
      # handle. A single failure here is signal, not noise — chase it.
      - name: Browser project (Firefox)
        run: TEST_BROWSER=firefox pnpm test:browser

      # Conformance is a separate project and deliberately out of `pnpm test`:
      # eight VFS through the invariants start workers and open real storage.
      # It runs on both engines because a VFS can be sound on one and broken on
      # the other — which is how HANDLE-1 was found.
      - name: Conformance (Chromium)
        run: pnpm test:conformance

      - name: Conformance (Firefox)
        run: CONFORMANCE_BROWSER=firefox pnpm test:conformance

  # Exercises the packed tarball across four consumption modes — Vite dev
  # server, Vite build+preview, rsbuild build+preview, and no bundler at all
  # — which `verify` never does because it bundles src/ and never touches
  # dist/, the exports map, or third-party worker resolution.
  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same key and same list as verify, on purpose — see the note there.
      # scripts/consumer-smoke.mjs imports { chromium } and drives nothing
      # else, so Firefox is dead weight here; sharing one cache entry and one
      # list across both jobs is worth that, because a per-job list is a pair
      # that has to stay in agreement forever.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Consumer smoke test
        run: pnpm test:consumer
