name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # From release-and-publish.yaml, when the push of `main` carrying the tagged
  # commit has no passing run of this workflow to reuse: the gate that blocks a
  # publication is then the SAME verification, not a copy of it.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What does not depend on the OS, once: the suites are tests.yaml's, below.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          browsers: ''

      # The only check a workflow gets before GitHub runs it: actionlint, and
      # shellcheck on every run: block (actionlint skips them silently without it).
      - name: Lint the workflows
        run: |
          command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          node scripts/actionlint.ts

      - name: Lint and format check
        run: pnpm exec biome ci .

      # VFS.md's VFS table is generated from VFS_CAPABILITIES, and README.md's
      # browser floor from the same data. Regenerate and fail on any diff: the
      # tables cannot drift from the declarations, while the conformance job
      # proves the declarations are true.
      - name: VFS table is current
        run: |
          pnpm docs:vfs
          git diff --exit-code VFS.md README.md

      - name: Type check
        run: pnpm exec tsc --noEmit

  # The same suites as every other platform, so the steps cannot drift apart,
  # and a red run keeps its .work/ logs as test-logs-Linux.
  linux:
    uses: ./.github/workflows/tests.yaml
    with:
      runs-on: ubuntu-latest
