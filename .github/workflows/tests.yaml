name: Tests

# The suites a platform runs. ci.yaml calls this for Linux beside its checks
# that do not depend on the OS (lint, docs, typecheck); each tests-<os>.yaml
# calls it by hand with its runner.
on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner label, e.g. windows-latest.
        required: true
        type: string
      time-scale:
        description: How many times Linux's bounds this platform needs (BSQ_TIME_SCALE).
        default: '1'
        type: string
      timeout-minutes:
        description: The job's bound.
        default: 90
        type: number
      browsers:
        description: The browsers to install and test, comma-separated; safari only when named, on macOS.
        default: chrome,firefox
        type: string

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      BSQ_TIME_SCALE: ${{ inputs.time-scale }}
      BROWSERS: ${{ inputs.browsers }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ inputs.browsers }}
      - run: pnpm build

      # `pnpm test` is the test planner (scripts/test-plan.ts) in complement
      # mode: the unit project, then each browser in both modes (not isolated
      # and cross-origin isolated), on the start pairs plus the cells that
      # complete them. Firefox needs no step and no environment variable of its
      # own. It was a separate step until 2026-09-03, which meant a developer's
      # local run covered Chromium alone while CI covered both: the exact path
      # by which a Firefox-only failure arrived late. Under CI=true a test that
      # no selected browser can run fails the step. Firefox has been a gate
      # since 2026-08-28 and still is — it is the only engine here that runs
      # the pool against a rotating exclusive OPFS handle, so a reduced-mode
      # regression lands there first and a single failure is signal, not noise.
      - name: Test
        run: |
          IFS=, read -ra list <<< "$BROWSERS"
          args=()
          for browser in "${list[@]}"; do args+=(--browser "$browser"); done
          pnpm test "${args[@]}"

      # Conformance is deliberately out of `pnpm test`: eight VFS through the
      # invariants start workers and open real storage, which is too slow for
      # the suite a developer runs on every change. One run covers every
      # browser — a VFS can be sound on one engine and broken on another, which
      # is how HANDLE-1 was found. `pnpm test:conformance` selects Chrome's and
      # Firefox's projects, so the list is given here, under its same bound.
      - name: Conformance
        run: |
          IFS=, read -ra list <<< "$BROWSERS"
          args=()
          for browser in "${list[@]}"; do args+=(--project "conformance $browser"); done
          node scripts/bounded.ts 1800 node scripts/test-parallel.ts "${args[@]}"
      # The step log keeps only the last 60 lines of a red job; every job's
      # whole log and report is in .work/.
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ runner.os }}
          path: .work/
          retention-days: 14
          # .work is a dotted path, excluded by default: the step would then
          # succeed having uploaded nothing.
          include-hidden-files: true
          if-no-files-found: error
