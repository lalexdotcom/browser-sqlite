name: Matrix (macOS 27)

# Every pair through Chrome's, Firefox's and Safari's columns on macOS 27, by
# hand. Each run goes to the end and shows every pair: a macOS runner loses
# Safari sessions, and one such pair would otherwise cancel the others.
on:
  workflow_dispatch:

concurrency:
  group: matrix-macos-27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-27:
    # checks: write for the live progress check runs (scripts/ci-progress.ts):
    # a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/matrix.yaml
    with:
      # GitHub has no macos-27 label yet: macOS 27 comes only with the Xcode 27
      # image, in public preview. Move to macos-27 once it exists.
      runs-on: xcode-27
      browsers: chrome,firefox,safari
      # On GitHub's macOS runners a setTimeout(0) takes 16-25 ms in Chrome and
      # Firefox started by their WebDriver, against 4.5-6 ms on Linux and on a
      # Mac's foreground tab: a test built on timers runs ~4 times slower here.
      # 3, not 2, since a slow runner took a Chrome cell past its bound
      # (2026-11-15: 1414 s for 59 of 68 files, against 890-1182 s for all
      # 68): a hang is now cut far earlier (a test's timeout, a cell silent out
      # of every file), so the cell's bound is only the last resort.
      time-scale: '3'
      # One cell at a time: on these 3 cores the pair's browsers slowed each
      # other down to 130 times a local run while they overlapped, and to 5-15
      # times once alone (Chrome, 2026-11-15, the slowdown ending with the
      # pair's Firefox cell).
      jobs: '1'
      # The planner bounds each cell at 900 s × 3 = 45 min and, one at a time,
      # a pair of 6 cells takes at most 270 min; in practice 15-20 min a cell.
      # A cell run again after its browser failed takes a second bound
      # (scripts/test-plan.ts). The limit is GitHub's maximum: a hang there
      # ends the job without the planner's report.
      timeout-minutes: 360
      # Probing three browsers in both modes, Safari's one at a time.
      plan-timeout-minutes: 30
