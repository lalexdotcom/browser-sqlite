name: Tests (macOS 26)

on:
  workflow_dispatch:

concurrency:
  group: tests-macos-26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-26:
    uses: ./.github/workflows/tests.yaml
    with:
      runs-on: macos-26
      browsers: safari  # SPIKE fix/safari-second-client: revert before merge
