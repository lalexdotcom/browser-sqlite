name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # From release-and-publish.yaml, when the push of `main` carrying the tagged
  # commit has no passing run of this workflow to reuse: the gate that blocks a
  # publication is then the SAME verification, not a copy of it.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What does not depend on the OS, once: the browser suites are platform.yaml's,
  # below.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          browsers: ''

      # The only check a workflow gets before GitHub runs it: actionlint, and
      # shellcheck on every run: block (actionlint skips them silently without it).
      - name: Lint the workflows
        run: |
          command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          node scripts/actionlint.ts

      - name: Lint and format check
        run: pnpm exec biome ci .

      # VFS.md's VFS table is generated from VFS_CAPABILITIES, and README.md's
      # browser floor from the same data. Regenerate and fail on any diff: the
      # tables cannot drift from the declarations, while the conformance job
      # proves the declarations are true.
      - name: VFS table is current
        run: |
          pnpm docs:vfs
          git diff --exit-code VFS.md README.md

      - name: Type check
        run: pnpm exec tsc --noEmit

      # The package build, declarations included: it typechecks `src/` alone
      # under tsconfig.build.json, which the root typecheck does not.
      - name: Build
        run: pnpm build

      # Node only, the same on every OS: once, here, not per platform.
      - name: Unit tests
        run: pnpm test:unit

  # Linux, through the module the release calls for the other platforms, so a
  # change to what a platform owes reaches CI at once: the matrix, every pair
  # through every column, and the standalone tests and conformance beside it.
  # Fail-fast, because CI is a gate.
  linux:
    # checks: write for the live progress check runs (scripts/ci-progress.ts):
    # a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/platform.yaml
    with:
      os: linux
      fail-fast: true

  # The one check a ruleset requires of a pull request: the matrix's job names
  # come from its plan, so they cannot be listed in advance. Green only when
  # every job above is.
  ci:
    needs: [checks, linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
