name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # From release-and-publish.yaml, so the gate that blocks a publication is the
  # SAME verification, not a copy of it. A red CI on `main` blocks nothing by
  # itself — the two workflows are independent and the release is triggered by
  # a tag — so the release calls this one and waits for it. Duplicating these
  # steps there was the alternative, and the browser-list comment below already
  # says what two lists that must agree become.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stock Chrome and Firefox at the versions scripts/browsers.ts pins, and
      # their drivers, downloaded by WebdriverIO on first use. The key is that
      # file: a new pin is a new cache. GitHub's Ubuntu images carry both
      # browsers' system libraries.
      - name: Cache WebdriverIO browsers
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/wdio
          key: wdio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/browsers.ts') }}

      - name: Lint and format check
        run: pnpm exec biome ci .

      # VFS.md's VFS table is generated from VFS_CAPABILITIES, and README.md's
      # browser floor from the same data. Regenerate and fail on any diff: the
      # tables cannot drift from the declarations, while the conformance job
      # proves the declarations are true.
      - name: VFS table is current
        run: |
          pnpm docs:vfs
          git diff --exit-code VFS.md README.md

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      # Unit (Node), then the browser suite on BOTH engines — `pnpm test` is
      # one Vitest invocation over the unit, Chrome, Firefox and isolated
      # projects, so Firefox needs no step and no environment variable of its
      # own. It was a separate step until 2026-09-03, which meant a developer's
      # local run covered Chromium alone while this file covered both: the
      # exact path by which a Firefox-only failure arrived late. Firefox has
      # been a gate since 2026-08-28 and still is — it is the only engine here
      # that runs the pool against a rotating exclusive OPFS handle, so a
      # reduced-mode regression lands there first and a single failure is
      # signal, not noise.
      - name: Test
        run: pnpm test

      # Conformance is deliberately out of `pnpm test`: eight VFS through the
      # invariants start workers and open real storage, which is too slow for
      # the suite a developer runs on every change. Like `pnpm test`, this one
      # command covers both engines — a VFS can be sound on one and broken on
      # the other, which is how HANDLE-1 was found.
      - name: Conformance (both engines)
        run: pnpm test:conformance

  # Exercises the packed tarball across four consumption modes — Vite dev
  # server, Vite build+preview, rsbuild build+preview, and no bundler at all
  # — which `verify` never does because it tests the rslib build
  # (tests/build/) and never touches dist/, the exports map, or third-party
  # worker resolution.
  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stock Chrome and Firefox at the versions scripts/browsers.ts pins, and
      # their drivers, downloaded by WebdriverIO on first use. The key is that
      # file: a new pin is a new cache. GitHub's Ubuntu images carry both
      # browsers' system libraries.
      - name: Cache WebdriverIO browsers
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/wdio
          key: wdio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/browsers.ts') }}

      - name: Consumer smoke test
        run: pnpm test:consumer
