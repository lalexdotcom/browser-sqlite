name: Release and Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  # The push of `main` that carries the tagged commit has run CI and the matrix
  # on it. Wait for those runs and reuse them; anything but a passing run — none,
  # cancelled by a later push of `main`, failed — makes the release run its own.
  prior:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ci: ${{ steps.runs.outputs.ci }}
      matrix: ${{ steps.runs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Reuse the runs of the push of main
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SHA=$(git rev-parse HEAD)
          for WF in ci matrix; do
            ID=$(gh run list --workflow "$WF.yaml" --commit "$SHA" --event push \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$ID" ] && gh run watch "$ID" --exit-status --interval 30 > /dev/null; then
              echo "$WF=success" >> "$GITHUB_OUTPUT"
              echo "$WF.yaml: run $ID passed on $SHA, reused"
            else
              echo "$WF=rerun" >> "$GITHUB_OUTPUT"
              echo "$WF.yaml: no passing run on $SHA (${ID:-none}), the release runs its own"
            fi
          done

  # ci.yaml covers what the cells cannot: the unit project, which the cells'
  # `--project` filters never select.
  verify:
    needs: prior
    if: needs.prior.outputs.ci != 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  # The 22 pairs, in matrix.yaml so that they can also be run by hand.
  matrix:
    needs: prior
    if: needs.prior.outputs.matrix != 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/matrix.yaml

  # The packed tarball, statically (publint, Are the Types Wrong?) and through
  # five bundlers and a page with none. It proves the package is usable once
  # published, so it runs for a release only, never on a PR or a push of main.
  consumer-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stock Chrome and Firefox at the versions scripts/browsers.ts pins, and
      # their drivers, downloaded by WebdriverIO on first use. The key is that
      # file: a new pin is a new cache. GitHub's Ubuntu images carry both
      # browsers' system libraries.
      - name: Cache WebdriverIO browsers
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/wdio
          key: wdio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/browsers.ts') }}

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      # Chrome's sandbox needs them, and only the system Chrome has a profile
      # that allows them: the Chrome for Testing WebdriverIO downloads exits at
      # launch ("Chrome instance exited"). Lifting the restriction keeps the
      # sandbox, where --no-sandbox would drop it.
      - name: Let Chrome's sandbox create user namespaces
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # One download per browser and driver, before anything runs in parallel:
      # on a cold cache, parallel Vitest jobs fetched the same chromedriver at
      # once, and one spawned it before it was executable (EACCES).
      - name: Install browsers
        run: node scripts/browsers.ts install

      - name: Consumer smoke test
        run: pnpm test:consumer

  # Only when a CHECK failed, so before `release` has run and before anything
  # could be published. A failure after npm publish is left alone: deleting the
  # tag there would orphan a published version.
  untag:
    needs: [prior, verify, matrix, consumer-smoke]
    if: failure()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete the tag the matrix refused
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}"
          echo "::notice::${{ github.ref_name }} was deleted: the release checks did not pass."

  release:
    needs: [prior, verify, matrix, consumer-smoke]
    # A check reused from the push of main is skipped here, and a skipped need
    # would skip this job without the condition.
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
      # npm trusted publishing: the action publishes and moves dist-tags
      # through OIDC alone.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The release body is the CHANGELOG section for this tag. Nothing here
      # writes to CHANGELOG.md - the file is editorial, and CI only reads it.
      #
      # This runs before the action because it is the only place the tag, the
      # published version and the changelog are compared: the action publishes
      # the version it reads from package.json and validates the tag
      # separately, so nothing else checks that they agree.
      - name: Release notes from CHANGELOG.md 📝
        id: notes
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          PKG=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($PKG)"
            exit 1
          fi

          # Keep a Changelog: `## [1.2.3] - 2026-01-31`, and one link definition
          # per heading at the end of the file.
          HEADING=$(awk -v ver="$VERSION" 'index($0, "## [" ver "] - ") == 1 { print; exit }' CHANGELOG.md)
          if [ -z "$HEADING" ]; then
            echo "::error::no CHANGELOG.md heading for $VERSION"
            exit 1
          fi
          case "$HEADING" in
            *"] - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::CHANGELOG.md heading for $VERSION is not dated: $HEADING"; exit 1 ;;
          esac
          if ! awk -v ver="$VERSION" 'index($0, "[" ver "]: ") == 1 { ok=1 } END { exit !ok }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no link definition for [$VERSION]"
            exit 1
          fi

          # The section ends at the next heading, or at the link definitions
          # for the oldest one.
          FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "] - ") == 1 { found=1; next }
            found && index($0, "## ") == 1    { exit }
            found && /^\[[^]]+\]: /            { exit }
            found                             { print }
          ' CHANGELOG.md > "$FILE"

          # Not [ -s ]: a section of one blank line is one byte and would pass.
          if ! grep -q '[^[:space:]]' "$FILE"; then
            echo "::error::CHANGELOG.md section for $VERSION is empty"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Release body: $HEADING ($(wc -l < "$FILE") lines)"

      # The major tag, not a SHA: the action is ours and follows semver, so its
      # minor and patch releases are taken as they ship. A major is moved here.
      - uses: lalexdotcom/action-release-and-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-notes-file: ${{ steps.notes.outputs.file }}

  # The benchmark page is published for the version that was just released, and
  # only if the release actually succeeded. The condition is explicit because a
  # skipped ancestor (verify or matrix, reused from the push of main) would skip
  # this job too. Because a reusable workflow runs at the caller's ref, this
  # builds the tag, so the page and the npm tarball are the same code and the
  # page's banner can say so.
  pages:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
