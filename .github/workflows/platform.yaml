name: Platform
run-name: Platform · ${{ inputs.os }}

# Everything a platform owes, in one place: the matrix (every pair through every
# column of its browsers) and what runs outside it (the standalone tests and
# conformance). ci.yaml calls it for Linux on every pull request and push of
# main; the release calls it for Windows and both macOS; a run by hand checks
# one platform. Each platform's settings live here only, so every caller gets
# a change at once.
on:
  workflow_dispatch:
    inputs:
      os:
        description: The platform to check.
        required: true
        type: choice
        options: [linux, windows, macos-26, macos-27]
      fail-fast:
        description: Whether one red pair cancels the others.
        default: false
        type: boolean
  workflow_call:
    inputs:
      os:
        description: linux, windows, macos-26 or macos-27.
        required: true
        type: string
      fail-fast:
        description: Whether one red pair cancels the others; the callers that gate pass true.
        default: false
        type: boolean

# The caller's workflow is in the group: a run by hand and the release's run on
# the same ref check the same platform for different reasons.
concurrency:
  group: platform-${{ inputs.os }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The settings of the platform asked for, as outputs: a called workflow's
  # inputs cannot be computed from a table any other way.
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.os.outputs.runner }}
      browsers: ${{ steps.os.outputs.browsers }}
      time-scale: ${{ steps.os.outputs.time-scale }}
      jobs: ${{ steps.os.outputs.jobs }}
      matrix-timeout: ${{ steps.os.outputs.matrix-timeout }}
      plan-timeout: ${{ steps.os.outputs.plan-timeout }}
      standalone-timeout: ${{ steps.os.outputs.standalone-timeout }}
    steps:
      - id: os
        env:
          OS: ${{ inputs.os }}
        run: |
          set -euo pipefail
          # runner browsers time-scale jobs matrix-timeout plan-timeout standalone-timeout
          case "$OS" in
            # The planner bounds each cell at 900 s; the standalone step and
            # conformance at (900 + 1800) s through bounded.ts.
            linux) set -- ubuntu-latest chrome,firefox 1 '' 25 15 60 ;;
            # Firefox pays 50-220 ms of fsyncs for every OPFS file open, close
            # or delete on Windows (Mozilla bug 2072928): its OPFS tests run
            # 7-16 times slower than Chrome's there, hence the scale 4. A cell
            # is bounded at 900 s × 4 = 60 min, and as many run at once as the
            # runner has cores less one (3 of 4): a pair of 4 cells takes at
            # most two rounds, 120 min, plus the probes, at Windows' pace.
            # Outside the matrix, (900 + 1800) s × 4 = 180 min.
            windows) set -- windows-latest chrome,firefox 4 '' 150 60 190 ;;
            # On GitHub's macOS runners a setTimeout(0) takes 16-25 ms in
            # Chrome and Firefox started by their WebDriver, against 4.5-6 ms
            # on Linux and on a Mac's foreground tab. 2 is enough with one cell
            # at a time: the longest cell took 619 s, a third of its bound
            # (2026-11-15); 3 pushed open-retry's own fallback past the
            # library's unscaled retry budget. One cell at a time: on these 3
            # cores the pair's browsers slowed each other down to 130 times a
            # local run while they overlapped, 5-15 times once alone. A cell
            # is bounded at 900 s × 2 = 30 min; a pair of 6 cells takes at
            # most 180 min, 210 with a cell run again, so the matrix bound is
            # GitHub's maximum. Probing three browsers, Safari's one at a time.
            # Outside the matrix, (900 + 1800) s × 2 = 90 min.
            macos-26) set -- macos-26 chrome,firefox,safari 2 1 360 30 100 ;;
            # GitHub has no macos-27 label yet: macOS 27 comes only with the
            # Xcode 27 image, in public preview. Move to macos-27 once it exists.
            macos-27) set -- xcode-27 chrome,firefox,safari 2 1 360 30 100 ;;
            *) echo "::error::unknown platform '$OS'"; exit 1 ;;
          esac
          {
            echo "runner=$1"
            echo "browsers=$2"
            echo "time-scale=$3"
            echo "jobs=$4"
            echo "matrix-timeout=$5"
            echo "plan-timeout=$6"
            echo "standalone-timeout=$7"
          } >> "$GITHUB_OUTPUT"

  matrix:
    needs: settings
    # checks: write for the live progress check runs (scripts/ci-progress.ts):
    # a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/matrix.yaml
    with:
      runs-on: ${{ needs.settings.outputs.runner }}
      browsers: ${{ needs.settings.outputs.browsers }}
      time-scale: ${{ needs.settings.outputs.time-scale }}
      jobs: ${{ needs.settings.outputs.jobs }}
      timeout-minutes: ${{ fromJSON(needs.settings.outputs.matrix-timeout) }}
      plan-timeout-minutes: ${{ fromJSON(needs.settings.outputs.plan-timeout) }}
      fail-fast: ${{ inputs.fail-fast }}

  standalone:
    needs: settings
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/standalone.yaml
    with:
      runs-on: ${{ needs.settings.outputs.runner }}
      browsers: ${{ needs.settings.outputs.browsers }}
      time-scale: ${{ needs.settings.outputs.time-scale }}
      timeout-minutes: ${{ fromJSON(needs.settings.outputs.standalone-timeout) }}
