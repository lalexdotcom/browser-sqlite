name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # From release-and-publish.yaml, when the push of `main` carrying the tagged
  # commit has no passing run of this workflow to reuse: the gate that blocks a
  # publication is then the SAME verification, not a copy of it.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The only check a workflow gets before GitHub runs it: actionlint, and
      # shellcheck on every run: block (actionlint skips them silently without it).
      - name: Lint the workflows
        run: |
          command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          node scripts/actionlint.ts

      # Stock Chrome and Firefox at the versions scripts/browsers.ts pins, and
      # their drivers, downloaded by WebdriverIO on first use. The key is that
      # file: a new pin is a new cache. GitHub's Ubuntu images carry both
      # browsers' system libraries.
      - name: Cache WebdriverIO browsers
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/wdio
          key: wdio-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/browsers.ts') }}

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      # Chrome's sandbox needs them, and only the system Chrome has a profile
      # that allows them: the Chrome for Testing WebdriverIO downloads exits at
      # launch ("Chrome instance exited"). Lifting the restriction keeps the
      # sandbox, where --no-sandbox would drop it.
      - name: Let Chrome's sandbox create user namespaces
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # One download per browser and driver, before anything runs in parallel:
      # on a cold cache, parallel Vitest jobs fetched the same chromedriver at
      # once, and one spawned it before it was executable (EACCES).
      - name: Install browsers
        run: node scripts/browsers.ts install

      - name: Lint and format check
        run: pnpm exec biome ci .

      # VFS.md's VFS table is generated from VFS_CAPABILITIES, and README.md's
      # browser floor from the same data. Regenerate and fail on any diff: the
      # tables cannot drift from the declarations, while the conformance job
      # proves the declarations are true.
      - name: VFS table is current
        run: |
          pnpm docs:vfs
          git diff --exit-code VFS.md README.md

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      # `pnpm test` is the test planner (scripts/test-plan.ts) in complement
      # mode: the unit project, then both browsers in both modes (not isolated
      # and cross-origin isolated), on the start pairs plus the cells that
      # complete them. Firefox needs no step and no environment variable of its
      # own. It was a separate step until 2026-09-03, which meant a developer's
      # local run covered Chromium alone while this file covered both: the
      # exact path by which a Firefox-only failure arrived late. Under
      # CI=true a test that no selected browser can run fails the step. Firefox
      # has been a gate since 2026-08-28 and still is — it is the only engine
      # here that runs the pool against a rotating exclusive OPFS handle, so a
      # reduced-mode regression lands there first and a single failure is
      # signal, not noise.
      - name: Test
        run: pnpm test

      # Conformance is deliberately out of `pnpm test`: eight VFS through the
      # invariants start workers and open real storage, which is too slow for
      # the suite a developer runs on every change. Like `pnpm test`, this one
      # command covers both engines — a VFS can be sound on one and broken on
      # the other, which is how HANDLE-1 was found.
      - name: Conformance (both engines)
        run: pnpm test:conformance
