name: Matrix (Ubuntu)

# The Linux matrix by hand, as matrix-windows.yaml and matrix-macos-*.yaml run
# theirs; ci.yaml runs the same, fail-fast, on every pull request and push of
# main. A run by hand goes to the end and shows every pair.
on:
  workflow_dispatch:

concurrency:
  group: matrix-ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    # checks: write for the live progress check runs (scripts/ci-progress.ts):
    # a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/matrix.yaml
    with:
      runs-on: ubuntu-latest
