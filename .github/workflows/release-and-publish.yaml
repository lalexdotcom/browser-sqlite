name: Release and Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  # A tag is not a branch push, so ci.yaml never runs on it — and a red CI on
  # `main` blocks nothing, since separate workflows cannot wait for each other.
  # Calling it is what makes the gate real, and it covers what the cells
  # cannot: the unit project, excluded by `--project 'chromium*'`.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  # `pnpm test` covers two of the 22 declared pairs; the rest are only seen
  # here, on the tag itself. One job per pair: ~10 min instead of ~70. Each
  # shard goes through test-matrix.mjs, which owns the per-cell timer.
  pairs:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.pairs }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The pair list lives in VFS_CAPABILITIES and nowhere else.
      # Single-quoted: backticks and ${...} in a double-quoted $( ) would be
      # eaten by bash before node saw them.
      - id: list
        run: |
          PAIRS=$(node --experimental-strip-types -e 'import("./scripts/test-matrix.mjs").then(({ allPairs }) => console.log(JSON.stringify(allPairs().map((p) => p.vfs + "/" + p.build))))')
          echo "pairs=$PAIRS" >> "$GITHUB_OUTPUT"

  cells:
    needs: pairs
    runs-on: ubuntu-latest
    # The default is six hours, and Firefox has an uncured hang here:
    # navigator.storage.getDirectory() can fail to settle in a worker.
    timeout-minutes: 25
    strategy:
      # A gate, not a triage tool (user, 2026-09-22): one red is enough to
      # refuse, and diagnosis happens in a local run, not in 22 job logs.
      fail-fast: true
      matrix:
        pair: ${{ fromJSON(needs.pairs.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-firefox-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Matrix ${{ matrix.pair }}
        run: node scripts/test-matrix.mjs --pair ${{ matrix.pair }}

  # Only when a CHECK failed, so before `release` has run and before anything
  # could be published. A failure after npm publish is left alone: deleting the
  # tag there would orphan a published version.
  untag:
    needs: [verify, cells]
    if: failure()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete the tag the matrix refused
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}"
          echo "::notice::${{ github.ref_name }} was deleted: the release checks did not pass."

  release:
    needs: [verify, cells]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The release body is the CHANGELOG section for this tag. Nothing here
      # writes to CHANGELOG.md - the file is editorial, and CI only reads it.
      #
      # This runs before the action because it is the only place the tag, the
      # published version and the changelog are compared: the action publishes
      # the version it reads from package.json and validates the tag
      # separately, so nothing else checks that they agree.
      - name: Release notes from CHANGELOG.md 📝
        id: notes
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          PKG=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($PKG)"
            exit 1
          fi

          HEADING=$(awk -v ver="$VERSION" 'index($0, "## " ver " — ") == 1 { print; exit }' CHANGELOG.md)
          if [ -z "$HEADING" ]; then
            echo "::error::no CHANGELOG.md heading for $VERSION"
            exit 1
          fi
          case "$HEADING" in
            *" — "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::CHANGELOG.md heading for $VERSION is not dated: $HEADING"; exit 1 ;;
          esac

          FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            index($0, "## " ver " — ") == 1 { found=1; next }
            found && index($0, "## ") == 1  { exit }
            found                           { print }
          ' CHANGELOG.md > "$FILE"

          # Not [ -s ]: a section of one blank line is one byte and would pass.
          if ! grep -q '[^[:space:]]' "$FILE"; then
            echo "::error::CHANGELOG.md section for $VERSION is empty"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Release body: $HEADING ($(wc -l < "$FILE") lines)"

      # Pinned to a SHA, not the mutable v1 tag: this job holds NPM_TOKEN, and
      # whoever can move that tag can move what runs with the token.
      - uses: lalexdotcom/action-release-and-publish@090f72d88c4a3d608e79e0a92daa50eec44e2ae4 # v1.3.1
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-notes-file: ${{ steps.notes.outputs.file }}

  # The benchmark page is published for the version that was just released, and
  # only if the release actually succeeded — `needs` is what makes that true.
  # Because a reusable workflow runs at the caller's ref, this builds the tag,
  # so the page and the npm tarball are the same code and the page's banner can
  # say so.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
