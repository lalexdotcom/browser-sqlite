name: Tests (Ubuntu)

# The Linux suites by hand, as tests-windows.yaml and tests-macos-*.yaml run
# theirs; ci.yaml runs the same on every pull request and push of main.
on:
  workflow_dispatch:

concurrency:
  group: tests-ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    # checks: write for the live progress check run (scripts/ci-progress.ts):
    # a called workflow cannot hold more than its caller grants.
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/tests.yaml
    with:
      runs-on: ubuntu-latest
