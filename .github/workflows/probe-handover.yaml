name: Probe hand-over (throwaway)

# TEMPORARY (ci/windows-macos): what a held OPFS file throws, and how long a
# terminated holder keeps it, per platform and browser. Removed before the
# merge.
on:
  push:
    branches:
      - ci/windows-macos

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - if: runner.os == 'macOS'
        run: sudo safaridriver --enable
      - run: node scripts/probe-handover.ts safari
