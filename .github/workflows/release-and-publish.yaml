name: Release and Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  # A tag is not a branch push, so ci.yaml never runs on it — and a red CI on
  # `main` blocks nothing, since separate workflows cannot wait for each other.
  # Calling it is what makes the gate real, and it covers what the cells
  # cannot: the unit project, which the cells' `--project` filters (`chrome ·*`,
  # `firefox ·*`, `isolated chrome ·*`, `isolated firefox ·*`) never select.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  # The 22 pairs, in matrix.yaml so that they can also be run by hand.
  matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/matrix.yaml

  # Only when a CHECK failed, so before `release` has run and before anything
  # could be published. A failure after npm publish is left alone: deleting the
  # tag there would orphan a published version.
  untag:
    needs: [verify, matrix]
    if: failure()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete the tag the matrix refused
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}"
          echo "::notice::${{ github.ref_name }} was deleted: the release checks did not pass."

  release:
    needs: [verify, matrix]
    permissions:
      contents: write
      # npm trusted publishing: the action publishes and moves dist-tags
      # through OIDC alone.
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The release body is the CHANGELOG section for this tag. Nothing here
      # writes to CHANGELOG.md - the file is editorial, and CI only reads it.
      #
      # This runs before the action because it is the only place the tag, the
      # published version and the changelog are compared: the action publishes
      # the version it reads from package.json and validates the tag
      # separately, so nothing else checks that they agree.
      - name: Release notes from CHANGELOG.md 📝
        id: notes
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          PKG=$(grep '"version"' package.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($PKG)"
            exit 1
          fi

          # Keep a Changelog: `## [1.2.3] - 2026-01-31`, and one link definition
          # per heading at the end of the file.
          HEADING=$(awk -v ver="$VERSION" 'index($0, "## [" ver "] - ") == 1 { print; exit }' CHANGELOG.md)
          if [ -z "$HEADING" ]; then
            echo "::error::no CHANGELOG.md heading for $VERSION"
            exit 1
          fi
          case "$HEADING" in
            *"] - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::CHANGELOG.md heading for $VERSION is not dated: $HEADING"; exit 1 ;;
          esac
          if ! awk -v ver="$VERSION" 'index($0, "[" ver "]: ") == 1 { ok=1 } END { exit !ok }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no link definition for [$VERSION]"
            exit 1
          fi

          # The section ends at the next heading, or at the link definitions
          # for the oldest one.
          FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "] - ") == 1 { found=1; next }
            found && index($0, "## ") == 1    { exit }
            found && /^\[[^]]+\]: /            { exit }
            found                             { print }
          ' CHANGELOG.md > "$FILE"

          # Not [ -s ]: a section of one blank line is one byte and would pass.
          if ! grep -q '[^[:space:]]' "$FILE"; then
            echo "::error::CHANGELOG.md section for $VERSION is empty"
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Release body: $HEADING ($(wc -l < "$FILE") lines)"

      # The major tag, not a SHA: the action is ours and follows semver, so its
      # minor and patch releases are taken as they ship. A major is moved here.
      - uses: lalexdotcom/action-release-and-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          release-notes-file: ${{ steps.notes.outputs.file }}

  # The benchmark page is published for the version that was just released, and
  # only if the release actually succeeded — `needs` is what makes that true.
  # Because a reusable workflow runs at the caller's ref, this builds the tag,
  # so the page and the npm tarball are the same code and the page's banner can
  # say so.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
