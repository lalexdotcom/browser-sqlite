name: Release and Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned to a SHA, not the mutable v1 tag: this job holds NPM_TOKEN, and
      # whoever can move that tag can move what runs with the token.
      - uses: lalexdotcom/action-release-and-publish@447a5fa6494f463fd8fb001ebfe4f93b47f374bd # v1
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The benchmark page is published for the version that was just released, and
  # only if the release actually succeeded — `needs` is what makes that true.
  # Because a reusable workflow runs at the caller's ref, this builds the tag,
  # so the page and the npm tarball are the same code and the page's banner can
  # say so.
  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml