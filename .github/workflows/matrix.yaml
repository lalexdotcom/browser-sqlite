name: Matrix

# Every declared VFS/build pair through the four columns of the matrix, one job
# per pair. Every push of `main` runs it, so a pair that regresses is seen at
# the merge; a release reuses that run, and calls this workflow only when the
# tagged commit has no passing one. workflow_dispatch runs it by hand on any
# branch, publishing nothing.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

# A new push of `main` supersedes the previous run. A called workflow takes the
# caller's `github.ref`, so a release's run is grouped under its tag and never
# under `main`.
concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Plans the whole matrix once, before any pair job starts: the planner
  # (scripts/test-plan.ts) probes both browsers, parses the tests, and prints
  # the plan. A test that no pair of any browser can run fails this job, once,
  # instead of failing every pair job; the pairs that have at least one test to
  # run become the matrix of `cells`. test-plan.ts also builds tests/build/ once,
  # before probing; the probe projects' global setup then skips its build.
  plan:
    runs-on: ubuntu-latest
    # The default is six hours; a stuck WebDriver session while probing both
    # browsers in both modes would hold the release gate that long.
    timeout-minutes: 15
    outputs:
      list: ${{ steps.list.outputs.pairs }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # --plan-only stops after the plan and its checks, and exits 1 naming any
      # dead test (always fatal in an all-pairs run). pairs.json is a one-line
      # JSON array of "vfs/build", the pairs with a non-empty cell.
      - id: list
        run: |
          node scripts/test-plan.ts --mode all-pairs --plan-only --pairs-out pairs.json
          echo "pairs=$(cat pairs.json)" >> "$GITHUB_OUTPUT"

  # One job per pair of the plan, each running only that pair's non-empty cells
  # of the four columns (chrome, firefox, isolated chrome, isolated firefox) —
  # 263 s measured locally for one pair. Each goes through test-matrix.ts, which
  # hands the pair to the test planner: it runs each cell as its own process,
  # bounded by its own timer. `pnpm test` runs the start pairs and their
  # complement cells; the other combinations are only seen here.
  cells:
    needs: plan
    runs-on: ubuntu-latest
    # The default is six hours, and Firefox has an uncured hang here:
    # navigator.storage.getDirectory() can fail to settle in a worker.
    timeout-minutes: 25
    strategy:
      # A gate, not a triage tool (user, 2026-09-22): one red is enough to
      # refuse, and diagnosis happens in a local run, not in 22 job logs.
      fail-fast: true
      matrix:
        pair: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Matrix ${{ matrix.pair }}
        run: node scripts/test-matrix.ts --pair ${{ matrix.pair }}
      # The planner writes each cell's report and log to .matrix/ and prints the
      # last lines of a red cell's log, but a log tail may not say enough — and
      # "diagnose it locally" fails when the cell is green locally, which is how
      # rc.5 went.
      - name: Matrix report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-report-${{ strategy.job-index }}
          path: .matrix/
          retention-days: 14
          # .matrix is a dotted path, which v4 excludes by default — the step
          # then succeeds having uploaded nothing, which is how rc.5's second
          # refusal came back with an empty artifact list.
          include-hidden-files: true
          if-no-files-found: error
