name: Standalone

# What runs once per browser outside the matrix, on the given runner: the
# standalone tests, which the matrix leaves out (`test-plan.ts --mode
# standalone`, spec 2026-10-12 § 3), and conformance. A module: platform.yaml
# calls it beside matrix.yaml.
on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner label, e.g. windows-latest.
        required: true
        type: string
      browsers:
        description: The browsers to install and test, comma-separated; safari only when named, on macOS.
        default: chrome,firefox
        type: string
      time-scale:
        description: How many times Linux's bounds this platform needs (BSQ_TIME_SCALE).
        default: '1'
        type: string
      timeout-minutes:
        description: The job's bound, above its steps' own (bounded.ts, scaled).
        default: 60
        type: number

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # checks: write lets each planner publish its live progress check run
    # (scripts/ci-progress.ts); every caller grants it too.
    permissions:
      contents: read
      checks: write
    env:
      BSQ_TIME_SCALE: ${{ inputs.time-scale }}
      BROWSERS: ${{ inputs.browsers }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ inputs.browsers }}

      # The tests that use no VFS of their own, or compare VFS through a
      # constant: once per browser, non-isolated, in the pair their need takes.
      # Under CI=true a standalone test that no browser can run fails the step.
      - name: Standalone tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BSQ_PROGRESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BSQ_PROGRESS_LABEL: standalone · ${{ inputs.runs-on }}
        run: |
          IFS=, read -ra list <<< "$BROWSERS"
          args=()
          for browser in "${list[@]}"; do args+=(--browser "$browser"); done
          node scripts/bounded.ts 900 node scripts/test-plan.ts --mode standalone "${args[@]}"

      # Every VFS through the invariants, in one project per browser: a VFS can
      # be sound on one engine and broken on another, which is how HANDLE-1 was
      # found. Its tests loop over the VFS themselves, so the planner does not
      # cut them into cells.
      - name: Conformance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BSQ_PROGRESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BSQ_PROGRESS_LABEL: conformance · ${{ inputs.runs-on }}
        run: |
          IFS=, read -ra list <<< "$BROWSERS"
          args=()
          for browser in "${list[@]}"; do args+=(--project "conformance $browser"); done
          node scripts/bounded.ts 1800 node scripts/test-parallel.ts "${args[@]}"

      # The step log keeps only the last 60 lines of a red job; every job's
      # whole log and report is in .work/. Named after the runner: a release
      # calls this module once per platform in one run.
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-logs-${{ inputs.runs-on }}
          path: .work/
          retention-days: 14
          # .work is a dotted path, excluded by default: the step would then
          # succeed having uploaded nothing.
          include-hidden-files: true
          if-no-files-found: error

      # A cancelled or timed-out job, or a planner killed by bounded.ts, leaves
      # its progress check run open: close it as the job ended.
      - name: Close progress
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ job.status }}
        run: |
          [ -s "$RUNNER_TEMP/bsq-progress-ids" ] || exit 0
          node scripts/ci-progress.ts close "$CONCLUSION"
